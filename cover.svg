  <text x="140" y="846" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#2a2622">全部原样拉去卖</text>
  <rect x="440" y="818" width="440" height="36" rx="6" fill="#eee8de"/><rect x="440" y="818" width="431.6" height="36" rx="6" fill="#3f6e8c"/>
  <text x="1060" y="846" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#2a2622">7,700</text>
  <text x="140" y="956" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#2a2622">全部晒干再拉</text>
  <rect x="440" y="928" width="440" height="36" rx="6" fill="#eee8de"/><rect x="440" y="928" width="418.1" height="36" rx="6" fill="#a4521f"/>
