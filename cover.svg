  <text x="140" y="1090" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#8d857c">鲜辣椒 3,000 公斤 · 市场 200 公里 · 数字是虚构示例 · 价格运费自己填</text>
